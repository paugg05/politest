<!DOCTYPE html>
<html th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{result.title}, #{result.subtitle}, 'noindex_follow')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container wide">
    <h1 th:text="#{result.title}">Resultado del test político</h1>
    <p class="lead" th:text="#{result.subtitle}">Posición en cada eje</p>

    <section th:replace="~{fragments :: profile(${profile})}"></section>

    <h2 class="chart-title" th:text="#{result.chart.title}">Tu posición en cada eje</h2>
    <section th:replace="~{fragments :: chart(${bars})}"></section>

    <div class="share-box">
        <label for="share-url" th:text="#{result.link}">Enlace para compartir</label>
        <input id="share-url" type="text" readonly>
    </div>

    <div class="actions">
        <button type="button" class="button primary" data-action="copy"
                th:attr="data-done=#{result.copied}" th:text="#{result.copy}">Copiar enlace</button>
        <button type="button" class="button" data-action="share" hidden th:text="#{result.share}">Compartir</button>
        <button type="button" class="button" data-action="download" th:text="#{result.download}">Descargar imagen</button>
    </div>

    <p><a class="button primary" th:href="@{'/' + ${lang} + '/'}" th:text="#{result.take}">Haz tú también el test</a></p>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/share.js}" defer></script>
</body>
</html>
