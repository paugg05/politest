<!DOCTYPE html>
<html th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{app.title}, null, 'noindex')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container">
    <p class="progress-label" th:text="#{quiz.progress(${number}, ${total})}">Pregunta 1 de 112</p>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"
         th:attr="aria-valuenow=${percent}">
        <div class="progress-bar" th:style="'width:' + ${percent} + '%'"></div>
    </div>

    <h1 class="statement" th:text="${question.text}">Enunciado de la pregunta</h1>

    <form class="answers" method="post" th:action="@{'/' + ${lang} + '/quiz/answer'}">
        <input type="hidden" name="questionId" th:value="${question.id}">
        <button type="submit" name="value" value="2" class="answer ans-sa" th:text="#{quiz.answer.strongly_agree}">Absolutamente de acuerdo</button>
        <button type="submit" name="value" value="1" class="answer ans-a" th:text="#{quiz.answer.agree}">De acuerdo</button>
        <button type="submit" name="value" value="0" class="answer ans-n" th:text="#{quiz.answer.neutral}">Neutral</button>
        <button type="submit" name="value" value="-1" class="answer ans-d" th:text="#{quiz.answer.disagree}">En desacuerdo</button>
        <button type="submit" name="value" value="-2" class="answer ans-sd" th:text="#{quiz.answer.strongly_disagree}">Absolutamente en desacuerdo</button>
        <button type="submit" name="skip" value="true" class="skip" th:text="#{quiz.skip}">Omitir pregunta</button>
    </form>

    <form th:if="${canGoBack}" class="back-form" method="post" th:action="@{'/' + ${lang} + '/quiz/back'}">
        <button type="submit" class="link" th:text="#{quiz.back}">Anterior</button>
    </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
