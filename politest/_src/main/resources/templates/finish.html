<!DOCTYPE html>
<html th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{app.title}, null, 'noindex')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container wide">
    <h1 th:text="#{quiz.finish.title}">¡Has terminado!</h1>
    <p class="lead" th:text="#{quiz.finish.summary(${answered}, ${skipped})}">Resumen</p>

    <section th:replace="~{fragments :: profile(${profile})}"></section>

    <h2 class="chart-title" th:text="#{result.chart.title}">Tu posición en cada eje</h2>
    <section th:replace="~{fragments :: chart(${bars})}"></section>

    <th:block th:if="${affinity != null}">
        <section th:replace="~{fragments :: affinity(${affinity})}"></section>
    </th:block>

    <div class="actions">
        <form method="post" th:action="@{'/' + ${lang} + '/quiz/share'}">
            <button type="submit" class="button primary"
                    th:text="${shared} ? #{result.share.open} : #{result.share.create}">Crear enlace para compartir</button>
        </form>
        <button type="button" class="button" data-action="download" th:text="#{result.download}">Descargar imagen</button>
        <form method="post" th:action="@{'/' + ${lang} + '/quiz/restart'}">
            <button type="submit" class="button" th:text="#{quiz.restart}">Empezar de nuevo</button>
        </form>
    </div>
    <p class="note" th:text="#{result.share.note}">Nota sobre privacidad</p>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/share.js}" defer></script>
</body>
</html>
