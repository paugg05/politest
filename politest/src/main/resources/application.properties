spring.application.name=politest

# Base de datos (MySQL en Docker, ver compose.yaml)
spring.datasource.url=jdbc:mysql://localhost:3306/politest
spring.datasource.username=politest
spring.datasource.password=politest_dev_pass

# Flyway crea el esquema; Hibernate solo lo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Textos de interfaz por idioma (messages*.properties)
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# Sesión del test: caduca tras 2 horas de inactividad; cookie no accesible desde JavaScript
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Kafka (ver ../kafka/compose.yaml). Publicar es "mejor esfuerzo": con timeouts cortos, si Kafka no responde
# la petición del usuario no se queda esperando.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=5000

# Datos del sitio (en producción: variables de entorno APP_BASE_URL, APP_OWNER_NAME, ...)
# Sin barra final. Se usa para URLs canónicas, sitemap.xml, robots.txt e imágenes al compartir.
app.base-url=http://localhost:8080
app.contact-email=politictest@gmail.com
app.hosting-provider=[completar: proveedor de alojamiento]
