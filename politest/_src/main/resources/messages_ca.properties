pole.ECON.L.word=igualtat
pole.ECON.L.meaning=Creus que els recursos clau i la producció s’han de planificar i repartir de manera col·lectiva per reduir les desigualtats.
pole.ECON.R.word=iniciativa
pole.ECON.R.meaning=Confies en el mercat i la propietat privada com a motor de l’economia: la competència i la iniciativa individual generen riquesa.
pole.WELFARE.L.word=benestar
pole.WELFARE.L.meaning=Defenses que la sanitat, l’educació, les pensions i els ajuts siguin serveis públics universals, finançats entre tots.
pole.WELFARE.R.word=responsabilitat
pole.WELFARE.R.meaning=Prefereixes un Estat reduït i menys impostos, amb més pes de la responsabilitat personal i de la iniciativa privada en els serveis.
pole.LIBERTY.L.word=llibertat
pole.LIBERTY.L.meaning=Dones prioritat a les llibertats individuals i a la privacitat, fins i tot per sobre d’altres raons de seguretat.
pole.LIBERTY.R.word=ordre
pole.LIBERTY.R.meaning=Valores l’autoritat, la seguretat i el compliment ferm de les normes com a base d’una societat estable.
pole.CULTURE.L.word=progrés
pole.CULTURE.L.meaning=Veus amb bons ulls que els valors i els costums evolucionin, i dones suport a la diversitat i als nous models de família i de societat.
pole.CULTURE.R.word=tradició
pole.CULTURE.R.meaning=Dones valor als costums, la família i l’herència cultural i religiosa com a base que convé conservar.
pole.NATION.L.word=cooperació
pole.NATION.L.meaning=Et sents ciutadà del món: apostes per la cooperació internacional, l’obertura de fronteres i la diversitat d’orígens.
pole.NATION.R.word=sobirania
pole.NATION.R.meaning=Defenses que cada país decideixi per si mateix: control de fronteres, identitat nacional i menys cessió de poder a organismes internacionals.
pole.ECOLOGY.L.word=natura
pole.ECOLOGY.L.meaning=Poses per davant protegir el medi ambient i frenar el canvi climàtic, encara que això suposi limitar el creixement o el consum.
pole.ECOLOGY.R.word=desenvolupament
pole.ECOLOGY.R.meaning=Poses per davant el creixement econòmic, la indústria i l’ocupació, i confies en la tecnologia per resoldre els problemes ambientals.
pole.DEMOCRACY.L.word=participació
pole.DEMOCRACY.L.meaning=Vols que la ciutadania decideixi de manera més directa: referèndums, consultes i assemblees, amb menys intermediaris.
pole.DEMOCRACY.R.word=institucions
pole.DEMOCRACY.R.meaning=Confies en les institucions, en els representants electes i en l’opinió experta per prendre decisions complexes.
pole.CHANGE.L.word=reforma
pole.CHANGE.L.meaning=Creus que la societat millora amb reformes graduals i consensuades dins de les institucions existents.
pole.CHANGE.R.word=transformació
pole.CHANGE.R.meaning=Creus que els problemes de fons exigeixen canvis profunds i ràpids, encara que trenquin amb l’ordre establert.

# Afinidad con partidos (party-service)
affinity.title=Afinitat amb els partits
affinity.intro=Comparació orientativa entre els teus percentatges i les posicions estimades de cada partit en aquests mateixos vuit eixos. No és una recomanació de vot.
affinity.provisional=Dades provisionals (versió {0}): els programes oficials de les eleccions del 29 de novembre de 2026 encara no s’han publicat i les posicions es revisaran.
affinity.details=Veure la comparació per eix
affinity.you=Tu
affinity.method=Com es calcula: es mesura la distància a cada eix entre la teva posició i la del partit i se’n fa la mitjana; un 100 % voldria dir estar en la mateixa posició a tots els eixos.
affinity.disclaimer=Un partit no queda definit per vuit eixos i els percentatges són estimacions. Consulta sempre els programes i decideix per tu mateix.
