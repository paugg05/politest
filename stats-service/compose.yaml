# Database owned by stats-service (a microservice does not share its database with the others).
# Passwords are for local development only.
services:
  stats-db:
    image: mysql:8.4
    container_name: stats-db
    environment:
      MYSQL_DATABASE: politest_stats
      MYSQL_USER: stats
      MYSQL_PASSWORD: stats
      MYSQL_ROOT_PASSWORD: root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "3309:3306"
    volumes:
      - stats-db-data:/var/lib/mysql
  stats-phpmyadmin:
    image: phpmyadmin:5
    container_name: stats-phpmyadmin
    environment:
      PMA_HOST: stats-db
    ports:
      - "8086:80"
    depends_on:
      - stats-db
volumes:
  stats-db-data:
