home.title=Where do you stand politically?
home.intro=Answer {0} statements about the economy, liberties, culture, nation, ecology, democracy and social change. At the end you will see your position on each of the 8 axes, in an easy-to-read bar chart you can share.
home.start=Start the test
home.how.link=How it works
home.badge.languages=Català · Español · English
home.badge.duration=About 15-20 minutes
home.how.title=How the test works
home.step.1.title=Answer
home.step.1.text=Read each statement and choose from five options, from “Strongly agree” to “Strongly disagree”. If you would rather not answer a question, you can skip it.
home.step.2.title=Discover your position
home.step.2.text=At the end you will see your three strongest traits and what they mean, a flag built from them, and one bar per axis showing how much you lean toward each pole.
home.step.3.title=Share or download
home.step.3.text=If you want, create a link to show your result or download it as an image. It is up to you whether to share it.
home.method=Each statement belongs to one axis and pushes toward one of its two poles: agreeing adds toward that pole and disagreeing subtracts. To avoid the bias of agreeing with everything you read, every axis has the same number of statements in each direction. Skipped questions do not count.
home.axes.title=The 8 axes of the test
home.axes.intro=Instead of a single left-right line, the test measures eight independent dimensions. Two people with the same label can differ a lot, and someone can, for example, favour free markets and strong public healthcare at the same time.
home.axis.ECON=Who should control production and resources: the community and the state, or businesses and the market.
home.axis.WELFARE=How far the state should go on healthcare, education, pensions and benefits, and how it is funded.
home.axis.LIBERTY=The balance between individual liberties and security: criminal justice, surveillance, protest and authority.
home.axis.CULTURE=Social values such as family, religion and customs, and how far they should change or be preserved.
home.axis.NATION=Borders, immigration, international bodies and national identity versus cosmopolitanism.
home.axis.ECOLOGY=How to balance protecting the environment with economic growth and consumption.
home.axis.DEMOCRACY=How decisions should be made: through direct citizen participation or through representatives and experts.
home.axis.CHANGE=How to change society: through gradual reform within institutions or through deep transformation.
home.faq.title=Frequently asked questions
home.faq.1.q=How long does the test take?
home.faq.1.a=There are {0} statements. Allow 15 to 20 minutes, although you can go at your own pace and skip any question you prefer not to answer.
home.faq.2.q=Is this a scientific test?
home.faq.2.a=No. It is a tool for reflection and entertainment. The result depends on how the statements are worded and which axes were chosen, and no position is the right one.
home.faq.3.q=What do the percentages mean?
home.faq.3.a=Each axis runs from one pole to the other. 50% means balance, and values near 0% or 100% mean a strong lean toward one of the two poles. Skipped questions do not count.
home.faq.4.q=Do you store my answers?
home.faq.4.a=While you take the test, your answer to each question is kept in the server session and discarded when it expires; it is not saved in the database. When you finish, the percentage for each axis, the language and the day are recorded anonymously, with no name, IP address or session identifier, only to produce aggregate statistics. If you press “Create a share link”, the percentage for each axis is also saved behind a public link, without your name or any other personal data.
home.faq.5.q=Can other people see my result?
home.faq.5.a=Only if you give them the link. Shared results do not appear in search engines or in any public listing.
home.faq.6.q=Can I change language halfway through?
home.faq.6.a=Yes. Use the selector at the top: your progress is kept and the questions switch to the chosen language.
home.cta.title=Ready to find out where you stand?
home.disclaimer=This test is indicative only and has no scientific validity.
