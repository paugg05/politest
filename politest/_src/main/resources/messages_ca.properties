home.meta.title=Test polític: descobreix on et situes
home.meta.description=Test polític de {0} afirmacions per situar-te en 8 eixos (economia, llibertats, cultura, nació, ecologia, democràcia i més). Disponible en català, castellà i anglès.
home.title=On et situes políticament?
home.intro=Respon a {0} afirmacions sobre economia, llibertats, cultura, nació, ecologia, democràcia i canvi social. En acabar veuràs la teva posició en cadascun dels 8 eixos, amb una barra fàcil de llegir que pots compartir.
home.start=Començar el test
home.how.link=Com funciona
home.badge.languages=Català · Español · English
home.badge.duration=Uns 15-20 minuts
home.how.title=Com funciona el test
home.step.1.title=Respon
home.step.1.text=Llegeix cada afirmació i tria entre cinc opcions, d’«Absolutament d’acord» a «Absolutament en desacord». Si no vols contestar una pregunta, pots ometre-la.
home.step.2.title=Descobreix la teva posició
home.step.2.text=En acabar veuràs els teus tres trets més forts amb el seu significat, una bandera feta a partir d’ells i una barra per cada eix amb el percentatge d’inclinació cap a cada pol.
home.step.3.title=Comparteix o descarrega
home.step.3.text=Si vols, crea un enllaç per ensenyar el teu resultat o descarrega’l com a imatge. Tu decideixes si el comparteixes.
home.method=Cada afirmació pertany a un eix i empeny cap a un dels seus dos pols: estar-hi d’acord suma cap a aquell pol i estar-hi en desacord resta. Per evitar el biaix d’acceptar tot el que es llegeix, cada eix té el mateix nombre d’afirmacions en cada sentit. Les preguntes omeses no compten.
home.axes.title=Els 8 eixos del test
home.axes.intro=En lloc d’un únic eix esquerra-dreta, el test mesura vuit dimensions independents. Així dues persones amb la mateixa etiqueta poden diferir molt, i algú pot ser, per exemple, partidari del lliure mercat i d’una sanitat pública forta alhora.
home.axis.ECON=Qui ha de controlar la producció i els recursos: la col·lectivitat i l’Estat, o les empreses i el mercat.
home.axis.WELFARE=Fins on ha d’arribar l’Estat en sanitat, educació, pensions i ajudes, i com es finança.
home.axis.LIBERTY=L’equilibri entre llibertats individuals i seguretat: justícia penal, vigilància, protesta i autoritat.
home.axis.CULTURE=Valors socials com la família, la religió i els costums, i fins a quin punt han de canviar o conservar-se.
home.axis.NATION=Fronteres, immigració, organismes internacionals i identitat nacional davant del cosmopolitisme.
home.axis.ECOLOGY=Com equilibrar la protecció del medi ambient amb el creixement econòmic i el consum.
home.axis.DEMOCRACY=Com s’han de prendre les decisions: amb participació directa de la ciutadania o mitjançant representants i experts.
home.axis.CHANGE=Com canviar la societat: amb reformes graduals dins de les institucions o amb transformacions profundes.
home.faq.title=Preguntes freqüents
home.faq.1.q=Quant es triga a fer el test?
home.faq.1.a=Són {0} afirmacions. Calcula entre 15 i 20 minuts, tot i que pots anar al teu ritme i ometre les preguntes que no vulguis contestar.
home.faq.2.q=És un test científic?
home.faq.2.a=No. És una eina de reflexió i d’entreteniment. El resultat depèn de com estan redactades les afirmacions i dels eixos escollits, i cap posició no és la correcta.
home.faq.3.q=Què signifiquen els percentatges?
home.faq.3.a=Cada eix va d’un pol a l’altre. Un 50 % indica equilibri i els valors propers a 0 % o 100 % indiquen una inclinació forta cap a un dels dos pols. Les preguntes omeses no compten.
home.faq.4.q=Deseu les meves respostes?
home.faq.4.a=Mentre fas el test, les teves respostes es mantenen a la sessió del servidor i es descarten quan caduca. No es guarden a la base de dades. Només si prems «Crear un enllaç per compartir» es guarda el percentatge de cada eix, sense el teu nom ni cap altra dada personal.
home.faq.5.q=Pot veure una altra persona el meu resultat?
home.faq.5.a=Només si li dones l’enllaç. Els resultats compartits no apareixen als cercadors ni en cap llistat públic.
home.faq.6.q=Puc canviar d’idioma a mig test?
home.faq.6.a=Sí. Fes servir el selector de la part superior: el teu progrés es manté i les preguntes passen a mostrar-se en l’idioma escollit.
home.cta.title=A punt per descobrir on et situes?
home.disclaimer=Aquest test és orientatiu i no té validesa científica.
