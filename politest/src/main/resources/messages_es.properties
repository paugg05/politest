home.meta.description=Test político de {0} afirmaciones para situarte en 8 ejes (economía, libertades, cultura, nación, ecología, democracia y más). Disponible en catalán, español e inglés.
home.title=¿Dónde te sitúas políticamente?
home.intro=Responde a {0} afirmaciones sobre economía, libertades, cultura, nación, ecología, democracia y cambio social. Al terminar verás tu posición en cada uno de los 8 ejes, con una barra fácil de leer que puedes compartir.
home.start=Empezar el test
home.how.link=Cómo funciona
home.badge.languages=Catalán · Español · English
home.badge.duration=Unos 15-20 minutos
home.how.title=Cómo funciona el test
home.step.1.title=Responde
home.step.1.text=Lee cada afirmación y elige entre cinco opciones, de «Absolutamente de acuerdo» a «Absolutamente en desacuerdo». Si no quieres contestar una pregunta, puedes omitirla.
home.step.2.title=Descubre tu posición
home.step.2.text=Al terminar verás tus tres rasgos más fuertes con su significado, una bandera hecha a partir de ellos y una barra por cada eje con el porcentaje de inclinación hacia cada polo.
home.step.3.title=Comparte o descarga
home.step.3.text=Si quieres, crea un enlace para enseñar tu resultado o descárgalo como imagen. Tú decides si lo compartes.
home.method=Cada afirmación pertenece a un eje y empuja hacia uno de sus dos polos: estar de acuerdo suma hacia ese polo y estar en desacuerdo resta. Para evitar el sesgo de aceptar todo lo que se lee, cada eje tiene el mismo número de afirmaciones en cada sentido. Las preguntas omitidas no cuentan.
home.axes.title=Los 8 ejes del test
home.axes.intro=En lugar de un único eje izquierda-derecha, el test mide ocho dimensiones independientes. Así dos personas con la misma etiqueta pueden diferir mucho, y alguien puede ser, por ejemplo, partidario del libre mercado y de una sanidad pública fuerte a la vez.
home.axis.ECON=Quién debe controlar la producción y los recursos: la colectividad y el Estado, o las empresas y el mercado.
home.axis.WELFARE=Hasta dónde debe llegar el Estado en sanidad, educación, pensiones y ayudas, y cómo se financia.
home.axis.LIBERTY=El equilibrio entre libertades individuales y seguridad: justicia penal, vigilancia, protesta y autoridad.
home.axis.CULTURE=Valores sociales como la familia, la religión y las costumbres, y hasta qué punto deben cambiar o conservarse.
home.axis.NATION=Fronteras, inmigración, organismos internacionales e identidad nacional frente al cosmopolitismo.
home.axis.ECOLOGY=Cómo equilibrar la protección del medio ambiente con el crecimiento económico y el consumo.
home.axis.DEMOCRACY=Cómo deben tomarse las decisiones: con participación directa de la ciudadanía o mediante representantes y expertos.
home.axis.CHANGE=Cómo cambiar la sociedad: con reformas graduales dentro de las instituciones o con transformaciones profundas.
home.faq.title=Preguntas frecuentes
home.faq.1.q=¿Cuánto se tarda en hacer el test?
home.faq.1.a=Son {0} afirmaciones. Calcula entre 15 y 20 minutos, aunque puedes ir a tu ritmo y omitir las preguntas que no quieras contestar.
home.faq.2.q=¿Es un test científico?
home.faq.2.a=No. Es una herramienta de reflexión y entretenimiento. El resultado depende de cómo están redactadas las afirmaciones y de los ejes elegidos, y ninguna posición es la correcta.
home.faq.3.q=¿Qué significan los porcentajes?
home.faq.3.a=Cada eje va de un polo a otro. Un 50 % indica equilibrio y los valores cercanos a 0 % o 100 % indican una inclinación fuerte hacia uno de los dos polos. Las preguntas omitidas no cuentan.
home.faq.4.q=¿Guardáis mis respuestas?
home.faq.4.a=Mientras haces el test, tus respuestas a cada pregunta se mantienen en la sesión del servidor y se descartan al caducar; no se guardan en la base de datos. Al terminar se registra de forma anónima el porcentaje de cada eje, el idioma y el día, sin nombre, dirección IP ni identificador de sesión, solo para elaborar estadísticas agregadas. Si pulsas «Crear enlace para compartir» se guarda además el porcentaje de cada eje con un enlace público, sin tu nombre ni ningún otro dato personal.
home.faq.5.q=¿Puede ver otra persona mi resultado?
home.faq.5.a=Solo si le das el enlace. Los resultados compartidos no aparecen en buscadores ni en ningún listado público.
home.faq.6.q=¿Puedo cambiar de idioma a mitad del test?
home.faq.6.a=Sí. Usa el selector de la parte superior: tu progreso se mantiene y las preguntas pasan a mostrarse en el idioma elegido.
home.cta.title=¿Listo para descubrir dónde te sitúas?
home.disclaimer=Este test es orientativo y no tiene validez científica.
