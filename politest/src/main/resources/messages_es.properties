pole.ECON.L.word=igualdad
pole.ECON.L.meaning=Crees que los recursos clave y la producción deben planificarse y repartirse de forma colectiva para reducir las desigualdades.
pole.ECON.R.word=iniciativa
pole.ECON.R.meaning=Confías en el mercado y la propiedad privada como motor de la economía: la competencia y la iniciativa individual generan riqueza.
pole.WELFARE.L.word=bienestar
pole.WELFARE.L.meaning=Defiendes que la sanidad, la educación, las pensiones y las ayudas sean servicios públicos universales, financiados entre todos.
pole.WELFARE.R.word=responsabilidad
pole.WELFARE.R.meaning=Prefieres un Estado reducido y menos impuestos, con más peso de la responsabilidad personal y de la iniciativa privada en los servicios.
pole.LIBERTY.L.word=libertad
pole.LIBERTY.L.meaning=Das prioridad a las libertades individuales y a la privacidad, incluso por encima de otras razones de seguridad.
pole.LIBERTY.R.word=orden
pole.LIBERTY.R.meaning=Valoras la autoridad, la seguridad y el cumplimiento firme de las normas como base de una sociedad estable.
pole.CULTURE.L.word=progreso
pole.CULTURE.L.meaning=Ves con buenos ojos que los valores y las costumbres evolucionen, y apoyas la diversidad y los nuevos modelos de familia y de sociedad.
pole.CULTURE.R.word=tradición
pole.CULTURE.R.meaning=Das valor a las costumbres, la familia y la herencia cultural y religiosa como una base que conviene conservar.
pole.NATION.L.word=cooperación
pole.NATION.L.meaning=Te sientes ciudadano del mundo: apuestas por la cooperación internacional, la apertura de fronteras y la diversidad de orígenes.
pole.NATION.R.word=soberanía
pole.NATION.R.meaning=Defiendes que cada país decida por sí mismo: control de fronteras, identidad nacional y menos cesión de poder a organismos internacionales.
pole.ECOLOGY.L.word=naturaleza
pole.ECOLOGY.L.meaning=Antepones proteger el medio ambiente y frenar el cambio climático, aunque eso suponga limitar el crecimiento o el consumo.
pole.ECOLOGY.R.word=desarrollo
pole.ECOLOGY.R.meaning=Antepones el crecimiento económico, la industria y el empleo, y confías en la tecnología para resolver los problemas ambientales.
pole.DEMOCRACY.L.word=participación
pole.DEMOCRACY.L.meaning=Quieres que la ciudadanía decida de forma más directa: referéndums, consultas y asambleas, con menos intermediarios.
pole.DEMOCRACY.R.word=instituciones
pole.DEMOCRACY.R.meaning=Confías en las instituciones, en los representantes electos y en la opinión experta para tomar decisiones complejas.
pole.CHANGE.L.word=reforma
pole.CHANGE.L.meaning=Crees que la sociedad mejora con reformas graduales y consensuadas dentro de las instituciones existentes.
pole.CHANGE.R.word=transformación
pole.CHANGE.R.meaning=Crees que los problemas de fondo exigen cambios profundos y rápidos, aunque rompan con el orden establecido.

# Afinidad con partidos (party-service)
affinity.title=Afinidad con los partidos
affinity.intro=Comparación orientativa entre tus porcentajes y las posiciones estimadas de cada partido en estos mismos ocho ejes. No es una recomendación de voto.
affinity.provisional=Datos provisionales (versión {0}): los programas oficiales de las elecciones del 29 de noviembre de 2026 aún no están publicados y las posiciones se revisarán.
affinity.details=Ver comparación por eje
affinity.you=Tú
affinity.method=Cómo se calcula: se mide la distancia en cada eje entre tu posición y la del partido y se hace la media; 100 % significaría estar en la misma posición en todos los ejes.
affinity.disclaimer=Un partido no queda definido por ocho ejes y los porcentajes son estimaciones. Consulta siempre los programas y decide por ti mismo.

# Personajes históricos (figure-service)
figures.title=Tu personaje histórico más afín
figures.intro=Comparación orientativa entre tus porcentajes y las posiciones estimadas de personajes históricos del siglo XX y principios del XXI en estos mismos ocho ejes. Incluye figuras de ideologías y regímenes muy distintos, también dictaduras.
figures.disclaimer=Muestra afinidad en estos ocho ejes, no apoyo a los actos, las decisiones ni el régimen de ninguna de esas personas. Las posiciones son estimaciones que simplifican figuras históricas complejas, y algunos ejes no existían como tema en su época.
