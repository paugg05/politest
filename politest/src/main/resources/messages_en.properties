pole.ECON.L.word=equality
pole.ECON.L.meaning=You lean towards collective ownership and planning of key resources to reduce inequality.
pole.ECON.R.word=enterprise
pole.ECON.R.meaning=You trust markets and private property as the engine of the economy: competition and individual initiative create wealth.
pole.WELFARE.L.word=welfare
pole.WELFARE.L.meaning=You favour universal public services (health, education, pensions and support) funded by everyone.
pole.WELFARE.R.word=self-reliance
pole.WELFARE.R.meaning=You prefer a smaller state and lower taxes, with more room for personal responsibility and private provision.
pole.LIBERTY.L.word=liberty
pole.LIBERTY.L.meaning=You put individual freedoms and privacy first, even ahead of other security concerns.
pole.LIBERTY.R.word=order
pole.LIBERTY.R.meaning=You value authority, security and firm enforcement of rules as the basis of a stable society.
pole.CULTURE.L.word=progress
pole.CULTURE.L.meaning=You welcome changing values and customs, and support diversity and new models of family and society.
pole.CULTURE.R.word=tradition
pole.CULTURE.R.meaning=You value customs, family and cultural and religious heritage as foundations worth preserving.
pole.NATION.L.word=cooperation
pole.NATION.L.meaning=You see yourself as a citizen of the world: international cooperation, open borders and diversity of origins.
pole.NATION.R.word=sovereignty
pole.NATION.R.meaning=You believe each nation should decide for itself: border control, national identity and less power handed to international bodies.
pole.ECOLOGY.L.word=nature
pole.ECOLOGY.L.meaning=You put protecting the environment and tackling climate change first, even if it means limiting growth or consumption.
pole.ECOLOGY.R.word=growth
pole.ECOLOGY.R.meaning=You put economic growth, industry and jobs first, and trust technology to solve environmental problems.
pole.DEMOCRACY.L.word=participation
pole.DEMOCRACY.L.meaning=You want citizens to decide more directly: referendums, consultations and assemblies, with fewer intermediaries.
pole.DEMOCRACY.R.word=institutions
pole.DEMOCRACY.R.meaning=You trust institutions, elected representatives and expert advice to make complex decisions.
pole.CHANGE.L.word=reform
pole.CHANGE.L.meaning=You believe society improves through gradual, agreed reforms within existing institutions.
pole.CHANGE.R.word=transformation
pole.CHANGE.R.meaning=You believe deep-rooted problems call for deep and rapid change, even if it breaks with the established order.

# Afinidad con partidos (party-service)
affinity.title=Affinity with the parties
affinity.intro=An indicative comparison between your percentages and each party’s estimated position on these same eight axes. It is not a voting recommendation.
affinity.provisional=Provisional data (version {0}): the official manifestos for the 29 November 2026 election are not yet published and the positions will be reviewed.
affinity.details=See the comparison by axis
affinity.you=You
affinity.method=How it is calculated: the distance between your position and the party’s is measured on each axis and averaged; 100 % would mean the same position on every axis.
affinity.disclaimer=A party cannot be defined by eight axes and the percentages are estimates. Always read the manifestos and decide for yourself.

# Personajes históricos (figure-service)
figures.title=The historical figure you resemble most
figures.intro=An indicative comparison between your percentages and the estimated positions of historical figures from the 20th and early 21st centuries on these same eight axes. It includes figures from very different ideologies and regimes, dictatorships among them.
figures.disclaimer=It shows affinity on these eight axes, not support for the actions, decisions or regime of any of these people. The positions are estimates that simplify complex historical figures, and some axes were not an issue in their time.
