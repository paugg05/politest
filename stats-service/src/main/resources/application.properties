spring.application.name=stats-service
server.port=8092

spring.datasource.url=jdbc:mysql://localhost:3309/politest_stats?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=stats
spring.datasource.password=stats

spring.flyway.enabled=true

# Kafka (see kafka/compose.yaml). Offsets are committed by the listener container after each record is handled.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=stats-service
spring.kafka.consumer.auto-offset-reset=earliest

management.endpoints.web.exposure.include=health,info
